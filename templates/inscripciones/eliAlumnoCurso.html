{% extends "layout.html" %}

{% block container %}
<script src="https://cdn.tailwindcss.com"></script>

<div class="w-full flex justify-center py-10">
    <form action="" method="post" novalidate class="w-full max-w-3xl px-8">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="curso_id"  value="{{ curso.id }}">
        <input type="hidden" name="alumno_id" value="{{ alumno.id }}">

        <h2 class="text-2xl font-bold text-gray-700 mb-6">Eliminar Alumno del Curso</h2>
        <p class="mb-4 text-gray-600">¿Estás seguro que deseas eliminar a este alumno del curso?</p>

        <div class="space-y-4 text-sm mb-6">
            <div class="flex justify-between border-b border-slate-300 pb-2">
                <span class="font-medium text-gray-500">Alumno</span>
                <span class="font-semibold">{{ alumno.nombre }} {{ alumno.apellidos }}</span>
            </div>
            <div class="flex justify-between border-b border-slate-300 pb-2">
                <span class="font-medium text-gray-500">Curso</span>
                <span class="font-semibold">{{ curso.nombre }}</span>
            </div>
        </div>

        <button type="submit"
            class="text-white bg-red-500 box-border border border-transparent hover:bg-red-600
            font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">
            Confirmar Eliminación
        </button>

        <a href="{{ url_for('inscripciones.alumnosCurso', id=curso.id) }}"
           class="bg-gray-500 text-white px-4 py-2 rounded-base">
            Cancelar
        </a>

    </form>
</div>

{% endblock %}
