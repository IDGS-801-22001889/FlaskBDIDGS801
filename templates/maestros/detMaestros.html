{% extends "layout.html" %}

{% block container %}

<script src="https://cdn.tailwindcss.com"></script>

<div class="min-h-screen flex items-center justify-center px-6">

    <div class="w-full max-w-3xl bg-slate-800 border border-slate-700 rounded-xl shadow-xl">

        <div class="flex flex-col md:flex-row">

            <div class="md:w-1/3 bg-slate-900 flex items-center justify-center p-8 border-b md:border-b-0 md:border-r border-slate-700">
                <img class="w-40 h-40 object-cover rounded-full border-4 border-blue-500 shadow-md"
                     src="{{url_for('static',filename='img/image.png')}}" alt="Foto">
            </div>

            <div class="md:w-2/3 p-10 text-slate-200">

                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-white tracking-wide">
                        Credencial de Maestro
                    </h2>
                    <div class="w-16 h-1 bg-blue-500 mt-2"></div>
                </div>

                <div class="space-y-4 text-sm">

                    <div class="flex justify-between border-b border-slate-700 pb-2">
                        <span class="font-medium text-slate-400">Matrícula</span>
                        <span class="text-white font-semibold">{{matricula}}</span>
                    </div>

                    <div class="flex justify-between border-b border-slate-700 pb-2">
                        <span class="font-medium text-slate-400">Nombre</span>
                        <span class="text-white font-semibold">{{nombre}}</span>
                    </div>

                    <div class="flex justify-between border-b border-slate-700 pb-2">
                        <span class="font-medium text-slate-400">Apellidos</span>
                        <span class="text-white font-semibold">{{apellidos}}</span>
                    </div>

                    <div class="flex justify-between border-b border-slate-700 pb-2">
                        <span class="font-medium text-slate-400">Especialidad</span>
                        <span class="text-white font-semibold">{{especialidad}}</span>
                    </div>

                    <div class="flex justify-between pb-2">
                        <span class="font-medium text-slate-400">Email</span>
                        <span class="text-white font-semibold">{{email}}</span>
                    </div>

                </div>

                <div class="mt-10">
                    <a href="{{ url_for('maestros.maestro') }}" 
                       class="inline-flex items-center text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-400 font-medium rounded-lg text-sm px-6 py-2.5 transition">
                        Regresar
                        <svg class="w-4 h-4 ms-2 rtl:rotate-180"
                             xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round"
                                  stroke-linejoin="round" stroke-width="2"
                                  d="M19 12H5m14 0-4 4m4-4-4-4"/>
                        </svg>
                    </a>
                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
